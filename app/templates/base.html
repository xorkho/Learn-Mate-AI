<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Study Assistant{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Lexend', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f2f1ff',
                            100: '#e7e5ff',
                            500: '#6659e8',
                            600: '#5546db',
                            700: '#4736c2',
                        },
                    },
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Lexend', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="flex items-center justify-between px-6 sm:px-8 py-4 bg-white/90 backdrop-blur border-b border-slate-200 sticky top-0 z-40">
        <a href="/dashboard" class="flex items-center gap-2.5 group">
            <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-brand-600 text-white font-display font-bold text-sm shadow-sm shadow-brand-600/30 group-hover:bg-brand-700 transition-colors">SA</span>
            <span class="font-display font-semibold text-slate-800 tracking-tight">Study Assistant</span>
        </a>

        <!-- Sirf login hone par dikhega -->
        <nav id="nav-links" class="text-sm hidden items-center gap-1">
            <a href="/dashboard" class="px-3 py-2 rounded-md text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors font-medium">My Documents</a>
            <a href="/progress" class="px-3 py-2 rounded-md text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors font-medium">Progress</a>
            <a href="#" onclick="signOut()" class="ml-2 px-3 py-2 rounded-md text-red-500 hover:text-red-600 hover:bg-red-50 transition-colors font-medium">Sign out</a>
        </nav>
    </div>

    {% block content %}{% endblock %}

    <script>
        // Public pages jahan bina login ke jana allowed hai
        const PUBLIC_PATHS = ["/", "/login", "/signup"];

        function getToken() {
            return localStorage.getItem("access_token");
        }

        function authHeaders() {
            return { "Authorization": "Bearer " + getToken() };
        }

        function signOut() {
            localStorage.removeItem("access_token");
            window.location.href = "/login";
        }

        // Navbar ko login state ke hisaab se dikhana/chhupana
        function updateNavbar() {
            const navLinks = document.getElementById("nav-links");
            if (getToken()) {
                navLinks.classList.remove("hidden");
                navLinks.classList.add("flex");
            } else {
                navLinks.classList.add("hidden");
                navLinks.classList.remove("flex");
            }
        }

        if (!getToken() && !PUBLIC_PATHS.includes(window.location.pathname)) {
            window.location.href = "/login";
        }

        updateNavbar();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
