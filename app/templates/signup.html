{% extends "base.html" %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-10">
    <div class="bg-white shadow rounded-lg p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-4">Create Account</h2>

        <div id="errorBox" class="hidden bg-red-100 text-red-700 text-sm px-3 py-2 rounded mb-3"></div>
        <div id="successBox" class="hidden bg-green-100 text-green-700 text-sm px-3 py-2 rounded mb-3"></div>

        <label class="block text-sm text-gray-600 mb-1">Email</label>
        <input type="email" id="email"
               class="w-full border border-gray-300 rounded-md px-3 py-2 mb-3 text-sm">

        <label class="block text-sm text-gray-600 mb-1">Password</label>
        <input type="password" id="password"
               class="w-full border border-gray-300 rounded-md px-3 py-2 mb-4 text-sm">

        <button onclick="signup()"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-md transition">
            Sign Up
        </button>

        <p class="text-sm text-gray-500 mt-4 text-center">
            Already have an account? <a href="/login" class="text-blue-600 underline">Login</a>
        </p>
    </div>
</div>

<script>
    async function signup() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const errorBox = document.getElementById("errorBox");
        const successBox = document.getElementById("successBox");
        errorBox.classList.add("hidden");
        successBox.classList.add("hidden");

        const res = await fetch("/auth/signup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
            successBox.textContent = "Account created! Redirecting to login...";
            successBox.classList.remove("hidden");
            setTimeout(() => { window.location.href = "/login"; }, 1200);
        } else {
            errorBox.textContent = data.detail || "Signup failed";
            errorBox.classList.remove("hidden");
        }
    }
</script>
{% endblock %}
