{% extends "base.html" %}
{% block title %}My Documents · Study Assistant{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto px-6 py-10">
    <div class="mb-8">
        <h1 class="text-2xl font-bold text-gray-800">My Documents</h1>
        <p class="text-gray-500 text-sm mt-1">Upload a PDF, then chat, summarize, or quiz yourself on it.</p>
    </div>

    <div class="bg-white shadow rounded-lg p-6 mb-8">
        <div id="dropzone"
             class="border-2 border-dashed border-blue-300 rounded-md py-10 px-4 text-center cursor-pointer hover:bg-blue-50 transition">
            <p class="text-gray-700 font-medium">Click to upload <span class="text-gray-400 font-normal">or drag a PDF here</span></p>
            <p class="text-gray-400 text-xs mt-1">Max size 10MB · PDF only</p>
            <input type="file" id="fileInput" accept=".pdf,.txt" class="hidden">
        </div>
        <div id="uploadStatus" class="mt-3 text-sm"></div>
    </div>

    <div id="docGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
const uploadStatus = document.getElementById("uploadStatus");
const docGrid = document.getElementById("docGrid");

dropzone.addEventListener("click", () => fileInput.click());

dropzone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropzone.classList.add("bg-blue-50");
});
dropzone.addEventListener("dragleave", () => dropzone.classList.remove("bg-blue-50"));
dropzone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropzone.classList.remove("bg-blue-50");
    if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener("change", () => {
    if (fileInput.files.length) uploadFile(fileInput.files[0]);
});

async function uploadFile(file) {
    const validExtensions = [".pdf", ".txt"];
    const isValid = validExtensions.some(ext => file.name.toLowerCase().endsWith(ext));

    if (!isValid) {
        uploadStatus.innerHTML = `<p class="text-red-600">Only PDF and TXT files are allowed.</p>`;
        return;
    }

    uploadStatus.innerHTML = `<p class="text-gray-500">Uploading and indexing "${file.name}"... this can take a moment.</p>`;

    const formData = new FormData();
    formData.append("file", file);

    try {
        const res = await fetch("/documents/upload", {
            method: "POST",
            headers: authHeaders(),
            body: formData,
        });

        if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || "Upload failed");
        }

        uploadStatus.innerHTML = `<p class="text-green-600">Uploaded successfully.</p>`;
        fileInput.value = "";
        loadDocuments();
    } catch (e) {
        uploadStatus.innerHTML = `<p class="text-red-600">${e.message}</p>`;
    }
}

async function loadDocuments() {
    try {
        const res = await fetch("/documents", { headers: authHeaders() });
        if (!res.ok) throw new Error("Could not load documents");
        const docs = await res.json();

        if (docs.length === 0) {
            docGrid.innerHTML = `<div class="col-span-full text-center text-gray-400 py-10">No documents yet — upload your first PDF above.</div>`;
            return;
        }

        docGrid.innerHTML = docs.map(doc => `
            <div class="bg-white shadow rounded-lg p-4 cursor-pointer hover:shadow-md transition" onclick="openWorkspace(${doc.id})">
                <span class="inline-block text-xs font-medium text-blue-700 bg-blue-100 px-2 py-0.5 rounded-full mb-2">PDF</span>
                <p class="font-medium text-gray-800 break-words">${doc.original_filename}</p>
                <div class="flex justify-between items-center text-xs text-gray-400 mt-2">
                    <span>${(doc.file_size / 1024).toFixed(0)} KB</span>
                    <span onclick="event.stopPropagation(); deleteDoc(${doc.id})" class="text-red-500 hover:text-red-700 cursor-pointer">Delete</span>
                </div>
            </div>
        `).join("");
    } catch (e) {
        docGrid.innerHTML = `<p class="text-red-600">${e.message}</p>`;
    }
}

function openWorkspace(docId) {
    window.location.href = `/workspace/${docId}`;
}

async function deleteDoc(docId) {
    if (!confirm("Delete this document? This cannot be undone.")) return;
    try {
        const res = await fetch(`/documents/${docId}`, {
            method: "DELETE",
            headers: authHeaders(),
        });
        if (!res.ok && res.status !== 204) throw new Error("Delete failed");
        loadDocuments();
    } catch (e) {
        alert(e.message);
    }
}

loadDocuments();
</script>
{% endblock %}
