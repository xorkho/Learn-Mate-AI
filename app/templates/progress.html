{% extends "base.html" %}
{% block title %}Progress · Study Assistant{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto px-6 py-10">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">My Progress</h1>

    <div id="progressContent">
        <p class="text-gray-500">Loading...</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadProgress() {
    const container = document.getElementById("progressContent");
    try {
        const res = await fetch("/chat/progress", { headers: authHeaders() });
        if (!res.ok) throw new Error("Could not load progress");
        const data = await res.json();

        if (data.total_attempts === 0) {
            container.innerHTML = `<p class="text-gray-400">No quiz attempts yet. Take a quiz to see your progress here.</p>`;
            return;
        }

        container.innerHTML = `
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                <div class="bg-white shadow rounded-lg p-5 text-center">
                    <p class="text-3xl font-bold text-blue-600">${data.total_documents}</p>
                    <p class="text-gray-500 text-sm mt-1">Documents</p>
                </div>
                <div class="bg-white shadow rounded-lg p-5 text-center">
                    <p class="text-3xl font-bold text-blue-600">${data.total_attempts}</p>
                    <p class="text-gray-500 text-sm mt-1">Quiz Attempts</p>
                </div>
                <div class="bg-white shadow rounded-lg p-5 text-center">
                    <p class="text-3xl font-bold text-blue-600">${data.overall_average_score}%</p>
                    <p class="text-gray-500 text-sm mt-1">Average Score</p>
                </div>
            </div>

            <div class="bg-white shadow rounded-lg p-6 mb-8">
                <h2 class="font-semibold text-gray-800 mb-4">Per Document</h2>
                <div class="flex flex-col gap-3">
                    ${data.documents.map(doc => `
                        <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                            <div>
                                <p class="font-medium text-gray-800 text-sm">${doc.document_name}</p>
                                <p class="text-xs text-gray-400">${doc.attempts} attempt(s)</p>
                            </div>
                            <div class="text-right">
                                <p class="text-sm font-semibold text-green-600">Best: ${doc.best_score}%</p>
                                <p class="text-xs text-gray-400">Latest: ${doc.latest_score}%</p>
                            </div>
                        </div>
                    `).join("")}
                </div>
            </div>

            <div class="bg-white shadow rounded-lg p-6">
                <h2 class="font-semibold text-gray-800 mb-4">Topics to Review</h2>
                <div class="flex flex-col gap-3">
                    ${data.weak_topics.map(t => `
                        <div class="flex justify-between items-center">
                            <p class="text-sm text-gray-700">${t.topic}</p>
                            <div class="flex items-center gap-2">
                                <div class="w-32 bg-gray-100 rounded-full h-2">
                                    <div class="bg-red-400 h-2 rounded-full" style="width: ${t.accuracy}%"></div>
                                </div>
                                <span class="text-xs text-gray-500 w-16 text-right">${t.correct}/${t.total} (${t.accuracy}%)</span>
                            </div>
                        </div>
                    `).join("")}
                </div>
            </div>
        `;
    } catch (e) {
        container.innerHTML = `<p class="text-red-600">${e.message}</p>`;
    }
}

loadProgress();
</script>
{% endblock %}
