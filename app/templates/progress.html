{% extends "base.html" %}
{% block title %}Progress · Study Assistant{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto px-6 sm:px-8 py-10">
    <div class="mb-8">
        <h1 class="font-display text-2xl font-semibold text-slate-800">My Progress</h1>
        <p class="text-slate-500 text-sm mt-1">Track how you're doing across your documents and topics.</p>
    </div>

    <div id="progressContent">
        <div class="flex items-center gap-2 text-slate-400 text-sm">
            <span class="inline-block h-3 w-3 rounded-full border-2 border-brand-300 border-t-brand-600 animate-spin"></span>
            Loading your progress...
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadProgress() {
    const container = document.getElementById("progressContent");
    try {
        const res = await fetch("/chat/progress", { headers: authHeaders() });
        if (!res.ok) throw new Error("Could not load progress");
        const data = await res.json();

        if (data.total_attempts === 0) {
            container.innerHTML = `
                <div class="bg-white ring-1 ring-slate-200 rounded-xl text-center py-16">
                    <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-slate-100 text-slate-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                        </svg>
                    </div>
                    <p class="text-slate-500 text-sm">No quiz attempts yet.</p>
                    <p class="text-slate-400 text-xs mt-1">Take a quiz from any document to see your progress here.</p>
                </div>`;
            return;
        }

        container.innerHTML = `
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                <div class="bg-white ring-1 ring-slate-200 rounded-xl p-5">
                    <p class="text-3xl font-display font-semibold text-slate-800">${data.total_documents}</p>
                    <p class="text-slate-500 text-sm mt-1">Documents</p>
                </div>
                <div class="bg-white ring-1 ring-slate-200 rounded-xl p-5">
                    <p class="text-3xl font-display font-semibold text-slate-800">${data.total_attempts}</p>
                    <p class="text-slate-500 text-sm mt-1">Quiz attempts</p>
                </div>
                <div class="bg-brand-600 rounded-xl p-5">
                    <p class="text-3xl font-display font-semibold text-white">${data.overall_average_score}%</p>
                    <p class="text-brand-100 text-sm mt-1">Average score</p>
                </div>
            </div>

            <div class="bg-white ring-1 ring-slate-200 rounded-xl p-6 mb-8">
                <h2 class="font-display font-semibold text-slate-800 mb-4">Per document</h2>
                <div class="flex flex-col divide-y divide-slate-100">
                    ${data.documents.map(doc => `
                        <div class="flex justify-between items-center py-3 first:pt-0 last:pb-0">
                            <div class="min-w-0 pr-4">
                                <p class="font-medium text-slate-800 text-sm truncate">${doc.document_name}</p>
                                <p class="text-xs text-slate-400">${doc.attempts} attempt(s)</p>
                            </div>
                            <div class="text-right shrink-0">
                                <p class="text-sm font-semibold text-emerald-600">Best: ${doc.best_score}%</p>
                                <p class="text-xs text-slate-400">Latest: ${doc.latest_score}%</p>
                            </div>
                        </div>
                    `).join("")}
                </div>
            </div>

            <div class="bg-white ring-1 ring-slate-200 rounded-xl p-6">
                <h2 class="font-display font-semibold text-slate-800 mb-1">Topics to review</h2>
                <p class="text-slate-400 text-xs mb-4">Your lowest-accuracy topics across all quizzes.</p>
                <div class="flex flex-col gap-4">
                    ${data.weak_topics.map(t => `
                        <div>
                            <div class="flex justify-between items-center mb-1.5">
                                <p class="text-sm text-slate-700 font-medium">${t.topic}</p>
                                <span class="text-xs text-slate-500">${t.correct}/${t.total} &middot; ${t.accuracy}%</span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-1.5">
                                <div class="bg-red-400 h-1.5 rounded-full" style="width: ${t.accuracy}%"></div>
                            </div>
                        </div>
                    `).join("")}
                </div>
            </div>
        `;
    } catch (e) {
        container.innerHTML = `<p class="text-red-600 text-sm">${e.message}</p>`;
    }
}

loadProgress();
</script>
{% endblock %}
